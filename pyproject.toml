[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "parquet-trader"
version = "0.11.0"
description = "Event-driven trading orchestrator with ChatGPT/GitHub bridge and deterministic risk controls"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "apscheduler>=3.10,<4",
  "exchange-calendars>=4.13,<5",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.8,<3",
  "PyYAML>=6.0,<7",
  "uvicorn>=0.30,<1",
  "websockets>=15,<16",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.11,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.6,<1",
  "types-PyYAML>=6.0,<7",
]

[project.scripts]
parquet = "parquet.main:main"
parquet-live-test = "parquet.live_test:main"
parquet-strategy-worker = "parquet.strategy_worker:main"

[tool.hatch.build.targets.wheel]
packages = ["src/parquet"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"src/parquet/strategy.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["parquet"]
