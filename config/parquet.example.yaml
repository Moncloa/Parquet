mode: shadow
state_db: /var/lib/parquet/parquet.db
host: 127.0.0.1
port: 8787
poll_seconds: 20

keys:
  private_key: /etc/parquet/private_key.pem
  public_key: /etc/parquet/public_key.pem

github:
  enabled: false
  repository: Moncloa/Parquet
  runtime_pr: 2
  token_file: /etc/parquet/github_token

etoro:
  enabled: false
  api_key_file: /etc/parquet/etoro_api_key
  user_key_file: /etc/parquet/etoro_user_key
  base_url: https://public-api.etoro.com/api/v1
  execution_base_url: https://public-api.etoro.com/api/v2
  # Required before supervised real execution. Pin this to the dedicated
  # Agent Portfolio GCID returned by `parquet etoro-check` / eToro `/me`.
  expected_gcid: null
  required_real_scopes:
    - etoro-public:real:read
    - etoro-public:real:write
    - etoro-public:trade.real:read
    - etoro-public:trade.real:write
  max_quote_age_seconds: 120
  account_poll_seconds: 60
  review_symbols:
    - GER40
    - NSDQ100
    - SPX500
    - GOLD
    - OIL
    - EURUSD
    - USDJPY
  # Optional aliases/cache for symbols whose eToro internal name differs.
  # Example: GOLD: 559 and OIL: 784 for the 24/7 instruments.
  instrument_ids: {}

strategy:
  # When true, Parquet dispatches new REVIEW_REQUEST events through the isolated
  # parquet-strategy service. This does not enable broker execution.
  enabled: false
  provider: codex_cli
  queue_dir: /var/lib/parquet-exchange

execution:
  # Manual one-shot bootstrap path.
  live_test_enabled: false
  live_test_max_amount_usd: 25.0

  # Autonomous execution remains shadow/demo only.
  autonomous_enabled: false
  autonomous_mode: shadow

  # Real Agent Portfolio execution is a separate supervised gate.
  supervised_real_enabled: false
  supervised_real_max_amount_usd: 25.0

  # Read-only order lookup after a submission. The POST itself is never retried.
  broker_lookup_attempts: 10
  broker_lookup_interval_seconds: 0.5

risk:
  stop_loss_required: true
  max_signal_age_minutes: 15
  max_open_positions: 2
  max_trades_per_day: 5
  max_daily_loss_pct: 3.0
  max_weekly_loss_pct: 6.0
  max_risk_per_trade_pct: 1.0
  max_position_notional_pct: 100.0
  max_spread_bps: 30.0
  max_entry_slippage_bps: 20.0
  max_risk_snapshot_age_seconds: 120
  allow_duplicate_symbol_positions: false

schedule:
  timezone: Europe/Madrid
  structural_reviews:
    - name: asia_open
      timezone: Asia/Tokyo
      calendar: XTKS
      hour: 9
      minute: 0
      offset_minutes: 1
    - name: europe_open
      timezone: Europe/Berlin
      calendar: XETR
      hour: 9
      minute: 0
      offset_minutes: 1
    - name: wall_street_open
      timezone: America/New_York
      calendar: XNYS
      hour: 9
      minute: 30
      offset_minutes: 1
